name: SDK tests
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - name: SDK profiles and TUI rendering
        run: python -m unittest discover -s tests -v
      - name: Installed SDK and console regression suite
        working-directory: /tmp
        run: python -m sdk.tui --selftest
      - name: Installed command-line entry points
        working-directory: /tmp
        run: |
          python -m sdk.tui --help
          python -m sdk.calibrate_gripper --help
