name: Control SDK tests
on:
  push:
    branches: [master, main, 'feat/metal-arm-control']
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - name: SDK, protocol, worker and dynamics contracts
        run: python -m unittest discover -s tests -v
      - name: Existing SDK and console regression suite
        run: python -m sdk.tui --selftest
      - name: Installed package simulation (outside source tree)
        working-directory: /tmp
        run: |
          metal-arm-control --demo --seconds 8 --log-level ERROR
          metal-arm-sdk-demo --log-level ERROR
          arx-x5-control --demo --log-level ERROR
