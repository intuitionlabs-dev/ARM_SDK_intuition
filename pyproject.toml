[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arx-x5-control"
version = "0.6.0"
description = "Python SDK and terminal UI for ARX X5 and Metal Arm over serial links"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[tool.setuptools]
packages = ["sdk", "sdk.board_defs", "sdk.tui"]
include-package-data = false

[tool.setuptools.package-dir]
"sdk" = "."

[tool.setuptools.package-data]
"sdk" = ["README.md", "API.md", "docs/*.md", "config/README.md"]
"sdk.board_defs" = ["LICENSE.MakerMods"]
